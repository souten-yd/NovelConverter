; =============================================================================
; NovelConverter – supervisord configuration
; All 4 services run in a single container
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/novelconverter/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── TTS Worker Base (port 8001) ───────────────────────────────────────────────
[program:tts_base]
command=python3 -m uvicorn app.workers.tts_base.main:app
        --host 0.0.0.0
        --port %(ENV_TTS_BASE_PORT)s
        --log-level info
directory=/app
environment=PYTHONPATH="/app",TTS_BASE_USE_REAL="%(ENV_TTS_BASE_USE_REAL)s",TTS_BASE_PORT="%(ENV_TTS_BASE_PORT)s",TTS_BASE_MODEL_PATH="%(ENV_TTS_BASE_MODEL_PATH)s",HF_HOME="%(ENV_HF_HOME)s",DATABASE_URL="%(ENV_DATABASE_URL)s"
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/novelconverter/tts_base.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/novelconverter/tts_base_err.log
stderr_logfile_maxbytes=5MB
priority=10

; ── TTS Worker Custom (port 8002) ─────────────────────────────────────────────
[program:tts_custom]
command=python3 -m uvicorn app.workers.tts_custom.main:app
        --host 0.0.0.0
        --port %(ENV_TTS_CUSTOM_PORT)s
        --log-level info
directory=/app
environment=PYTHONPATH="/app",TTS_CUSTOM_USE_REAL="%(ENV_TTS_CUSTOM_USE_REAL)s",TTS_CUSTOM_PORT="%(ENV_TTS_CUSTOM_PORT)s",TTS_CUSTOM_MODEL_PATH="%(ENV_TTS_CUSTOM_MODEL_PATH)s",HF_HOME="%(ENV_HF_HOME)s",DATABASE_URL="%(ENV_DATABASE_URL)s"
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/novelconverter/tts_custom.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/novelconverter/tts_custom_err.log
stderr_logfile_maxbytes=5MB
priority=10

; ── TTS Worker Design (port 8003) ─────────────────────────────────────────────
[program:tts_design]
command=python3 -m uvicorn app.workers.tts_design.main:app
        --host 0.0.0.0
        --port %(ENV_TTS_DESIGN_PORT)s
        --log-level info
directory=/app
environment=PYTHONPATH="/app",TTS_DESIGN_USE_REAL="%(ENV_TTS_DESIGN_USE_REAL)s",TTS_DESIGN_PORT="%(ENV_TTS_DESIGN_PORT)s",TTS_DESIGN_MODEL_PATH="%(ENV_TTS_DESIGN_MODEL_PATH)s",HF_HOME="%(ENV_HF_HOME)s",DATABASE_URL="%(ENV_DATABASE_URL)s"
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/novelconverter/tts_design.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/novelconverter/tts_design_err.log
stderr_logfile_maxbytes=5MB
priority=10

; ── Orchestrator (port 8000) ──────────────────────────────────────────────────
[program:orchestrator]
command=python3 -m uvicorn app.orchestrator.main:app
        --host 0.0.0.0
        --port %(ENV_ORCHESTRATOR_PORT)s
        --log-level info
directory=/app
environment=PYTHONPATH="/app",DATABASE_URL="%(ENV_DATABASE_URL)s",ORCHESTRATOR_PORT="%(ENV_ORCHESTRATOR_PORT)s",TTS_BASE_URL="%(ENV_TTS_BASE_URL)s",TTS_CUSTOM_URL="%(ENV_TTS_CUSTOM_URL)s",TTS_DESIGN_URL="%(ENV_TTS_DESIGN_URL)s",LLM_API_URL="%(ENV_LLM_API_URL)s",LLM_API_KEY="%(ENV_LLM_API_KEY)s",LLM_MODEL="%(ENV_LLM_MODEL)s"
autostart=true
autorestart=true
startsecs=8
startretries=3
stdout_logfile=/var/log/novelconverter/orchestrator.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/novelconverter/orchestrator_err.log
stderr_logfile_maxbytes=5MB
; Orchestrator starts after workers
priority=20
