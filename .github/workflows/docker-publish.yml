# =============================================================================
# NovelConverter – Docker Build & Publish to GHCR
#
# Triggers:
#   - Push to main / master
#   - Version tags (v*.*.*)
#   - Manual dispatch (workflow_dispatch)
#
# Published images:
#   ghcr.io/<owner>/novelconverter:latest
#   ghcr.io/<owner>/novelconverter:<tag>
#   ghcr.io/<owner>/novelconverter:<sha>
#
# Required secrets (Settings → Secrets → Actions):
#   GHCR_TOKEN  – GitHub Personal Access Token with write:packages scope
#                 (or use the built-in GITHUB_TOKEN for same-repo pushes)
#
# Optional secrets for RunPod status check:
#   RUNPOD_API_KEY  – RunPod API key
#   RUNPOD_POD_ID   – Pod ID to restart/check after new image is pushed
# =============================================================================

name: Docker Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      tts_real:
        description: "Include real TTS deps (heavy)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/novelconverter

jobs:
  # ===========================================================================
  # Job 1 – Build & push Docker image
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # ── QEMU for multi-platform (linux/amd64 only for GPU) ─────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # ── Login to GHCR ──────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Docker metadata (tags + labels) ───────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # semantic version tags  (v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # short SHA always
            type=sha,prefix=sha-,format=short
            # branch name
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=NovelConverter
            org.opencontainers.image.description=Local audiobook generator from novel text using Qwen3-TTS
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # ── Build (and optionally push) ────────────────────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # GPU images are linux/amd64 only
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ── Build cache (speed up subsequent runs) ─────────────────────────
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ steps.vars.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2 – Smoke test: pull image and verify /health endpoint
  # ===========================================================================
  smoke-test:
    name: Smoke Test (Mock TTS)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build-and-push.outputs.short_sha }}"
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Start container (mock TTS, no GPU)
        run: |
          docker run -d \
            --name nc_smoke \
            -p 8000:8000 -p 8001:8001 -p 8002:8002 -p 8003:8003 \
            -e TTS_BASE_USE_REAL=false \
            -e TTS_CUSTOM_USE_REAL=false \
            -e TTS_DESIGN_USE_REAL=false \
            "$IMAGE"
          echo "Container started"

      - name: Wait for services to be ready
        timeout-minutes: 3
        run: |
          echo "Waiting for Orchestrator (port 8000)..."
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ Orchestrator ready (attempt $i)"
              break
            fi
            echo "  attempt $i/36 – not ready yet, sleeping 5s"
            sleep 5
          done

          echo "Waiting for TTS Workers..."
          for port in 8001 8002 8003; do
            for i in $(seq 1 18); do
              if curl -sf http://localhost:${port}/health > /dev/null 2>&1; then
                echo "✓ Worker :${port} ready"
                break
              fi
              sleep 5
            done
          done

      - name: Health check – all services
        run: |
          echo "=== Orchestrator /health ==="
          curl -sf http://localhost:8000/health | python3 -m json.tool

          echo ""
          echo "=== /api/status (all workers) ==="
          curl -sf http://localhost:8000/api/status | python3 -m json.tool

          echo ""
          echo "=== TTS Base /health ==="
          curl -sf http://localhost:8001/health | python3 -m json.tool

          echo ""
          echo "=== TTS Custom /health ==="
          curl -sf http://localhost:8002/health | python3 -m json.tool

          echo ""
          echo "=== TTS Design /health ==="
          curl -sf http://localhost:8003/health | python3 -m json.tool

      - name: E2E smoke – create project and synthesize
        run: |
          echo "--- Create project ---"
          PROJECT=$(curl -sf -X POST http://localhost:8000/api/projects \
            -H 'Content-Type: application/json' \
            -d '{"name":"smoke-test","description":"CI smoke test"}')
          echo "$PROJECT" | python3 -m json.tool
          PROJECT_ID=$(echo "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "PROJECT_ID=$PROJECT_ID"

          echo "--- Upload sample text ---"
          curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/upload_text" \
            -F "file=@/app/samples/sample_novel.txt" | python3 -m json.tool

          echo "--- Preprocess ---"
          curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/preprocess" \
            | python3 -m json.tool

          echo "--- Segment speakers ---"
          curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/segment_speakers" \
            | python3 -m json.tool

          echo "--- Render (mock TTS) ---"
          curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/render" \
            | python3 -m json.tool

          echo "--- Wait for render to complete (max 60s) ---"
          for i in $(seq 1 12); do
            STATUS=$(curl -sf "http://localhost:8000/api/projects/${PROJECT_ID}/render/status" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'] if d else 'none')")
            echo "  render status: $STATUS"
            if [[ "$STATUS" == "done" || "$STATUS" == "error" ]]; then break; fi
            sleep 5
          done

          echo "--- Final render status ---"
          curl -sf "http://localhost:8000/api/projects/${PROJECT_ID}/render/status" | python3 -m json.tool

          echo "--- Merge audio ---"
          curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/merge" \
            | python3 -m json.tool

          echo "--- List artifacts ---"
          curl -sf "http://localhost:8000/api/projects/${PROJECT_ID}/artifacts" | python3 -m json.tool

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== supervisord log ==="
          docker exec nc_smoke cat /var/log/novelconverter/supervisord.log 2>/dev/null || true
          echo "=== orchestrator log ==="
          docker exec nc_smoke cat /var/log/novelconverter/orchestrator.log 2>/dev/null || true
          echo "=== docker logs ==="
          docker logs nc_smoke 2>&1 | tail -100

      - name: Cleanup
        if: always()
        run: docker rm -f nc_smoke 2>/dev/null || true

  # ===========================================================================
  # Job 3 – RunPod status check (optional, requires secrets)
  # ===========================================================================
  runpod-status:
    name: RunPod Status Check
    runs-on: ubuntu-latest
    needs: smoke-test
    if: ${{ secrets.RUNPOD_API_KEY != '' && secrets.RUNPOD_POD_ID != '' }}

    steps:
      - name: Check RunPod pod status
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
        run: |
          echo "=== Checking RunPod pod status ==="
          RESPONSE=$(curl -sf \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { pod(input: {podId: \\\"$RUNPOD_POD_ID\\\"}) { id name desiredStatus runtime { uptimeInSeconds ports { ip isIpPublic privatePort publicPort type } } } }\"}" \
            "https://api.runpod.io/graphql?api_key=$RUNPOD_API_KEY")
          echo "$RESPONSE" | python3 -m json.tool

      - name: Write RunPod deployment instructions
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "## 🚀 RunPod Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "New image available:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### RunPod Pod Settings" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Container Image | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Disk | 20GB+ |" >> $GITHUB_STEP_SUMMARY
          echo "| Volume Disk | 50GB+ (for models) |" >> $GITHUB_STEP_SUMMARY
          echo "| Volume Mount Path | \`/workspace\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Expose HTTP Port | \`8000\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GPU | RTX 3090 / A100 recommended |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment Variables for RunPod" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "TTS_CUSTOM_USE_REAL=true" >> $GITHUB_STEP_SUMMARY
          echo "TTS_DESIGN_USE_REAL=true" >> $GITHUB_STEP_SUMMARY
          echo "TTS_CUSTOM_MODEL_PATH=Qwen/Qwen3-TTS" >> $GITHUB_STEP_SUMMARY
          echo "HF_HOME=/workspace/hf_cache" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
