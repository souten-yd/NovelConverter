# =============================================================================
# NovelConverter – Docker Build & Publish to Docker Hub
#
# Triggers:
#   - Push to main / master
#   - Version tags (v*.*.*)
#   - Manual dispatch (workflow_dispatch)
#
# Published images:
#   docker.io/<DOCKERHUB_USERNAME>/novelconverter:latest
#   docker.io/<DOCKERHUB_USERNAME>/novelconverter:<tag>
#   docker.io/<DOCKERHUB_USERNAME>/novelconverter:sha-<sha>
#
# Required secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  – Docker Hub ユーザー名
#   DOCKERHUB_TOKEN     – Docker Hub Access Token
#                         (hub.docker.com → Account Settings → Security → Access Tokens)
#
# Optional secrets for RunPod status check:
#   RUNPOD_API_KEY  – RunPod API key
#   RUNPOD_POD_ID   – 状態チェック対象の Pod ID
# =============================================================================

name: Docker Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/novelconverter

jobs:
  # ===========================================================================
  # Job 1 – Build & push Docker image to Docker Hub
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      # ── Login to Docker Hub ────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Docker metadata (tags + labels) ───────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=NovelConverter
            org.opencontainers.image.description=Local audiobook generator from novel text using Qwen3-TTS
            org.opencontainers.image.vendor=${{ secrets.DOCKERHUB_USERNAME }}

      # ── Build & push (linux/amd64 only – GPU image) ───────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.event.inputs.push_image != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ steps.vars.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2 – Smoke test: pull & run container, check all health endpoints
  # ===========================================================================
  smoke-test:
    name: Smoke Test (Mock TTS, no GPU)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:sha-${{ needs.build-and-push.outputs.short_sha }}"
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Start container (mock TTS, no GPU)
        run: |
          docker run -d \
            --name nc_smoke \
            -p 8000:8000 -p 8001:8001 -p 8002:8002 -p 8003:8003 \
            -e TTS_BASE_USE_REAL=false \
            -e TTS_CUSTOM_USE_REAL=false \
            -e TTS_DESIGN_USE_REAL=false \
            "$IMAGE"
          echo "Container started (ID: $(docker inspect -f '{{.Id}}' nc_smoke | head -c 12))"

      - name: Wait for Orchestrator to be ready
        timeout-minutes: 3
        run: |
          echo "Waiting for Orchestrator (port 8000)..."
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ Orchestrator ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "ERROR: Orchestrator did not start in time"
              docker logs nc_smoke | tail -50
              exit 1
            fi
            echo "  attempt $i/36 – waiting 5s..."
            sleep 5
          done

      - name: Verify llama-server binary exists in container
        run: |
          docker exec nc_smoke bash -lc 'test -x "${LLAMA_SERVER_BIN:-/opt/llama-cpp/bin/llama-server}"'
          docker exec nc_smoke bash -lc 'echo "LLAMA_SERVER_BIN=${LLAMA_SERVER_BIN:-unset}"'

      - name: Wait for all TTS workers to be ready
        timeout-minutes: 2
        run: |
          for port in 8001 8002 8003; do
            echo "Waiting for TTS Worker :${port}..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:${port}/health > /dev/null 2>&1; then
                echo "✓ Worker :${port} ready (attempt $i)"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "ERROR: Worker :${port} did not start"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Health check – all services
        run: |
          echo "=== Orchestrator /health ==="
          curl -sf http://localhost:8000/health | python3 -m json.tool

          echo ""
          echo "=== /api/status (aggregate) ==="
          STATUS_JSON=$(curl -sf http://localhost:8000/api/status)
          echo "$STATUS_JSON" | python3 -m json.tool
          ALL_OK=$(echo "$STATUS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('all_healthy','false'))")
          if [ "$ALL_OK" != "True" ]; then
            echo "WARNING: Not all workers healthy, but continuing smoke test"
          fi

          echo ""
          echo "=== TTS Workers /health ==="
          for port in 8001 8002 8003; do
            echo "--- port $port ---"
            curl -sf http://localhost:${port}/health | python3 -m json.tool
          done

      - name: E2E smoke test – full pipeline
        run: |
          set -e

          echo "=== 1. Create project ==="
          PROJECT=$(curl -sf -X POST http://localhost:8000/api/projects \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-smoke","description":"GitHub Actions smoke test"}')
          echo "$PROJECT" | python3 -m json.tool
          PROJECT_ID=$(echo "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "PROJECT_ID=$PROJECT_ID"

          echo ""
          echo "=== 2. Upload sample text ==="
          curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/upload_text" \
            -F "file=@/app/samples/sample_novel.txt" | python3 -m json.tool

          echo ""
          echo "=== 3. Preprocess ==="
          PREP=$(curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/preprocess")
          echo "$PREP" | python3 -m json.tool
          SEG_COUNT=$(echo "$PREP" | python3 -c "import sys,json; print(json.load(sys.stdin)['segment_count'])")
          echo "Segments: $SEG_COUNT"
          [ "$SEG_COUNT" -gt 0 ] || (echo "ERROR: no segments" && exit 1)

          echo ""
          echo "=== 4. Segment speakers ==="
          SEG=$(curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/segment_speakers")
          echo "$SEG" | python3 -m json.tool

          echo ""
          echo "=== 5. Start render (mock TTS) ==="
          JOB=$(curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/render")
          echo "$JOB" | python3 -m json.tool
          JOB_STATUS=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Job status: $JOB_STATUS"

          echo ""
          echo "=== 6. Poll render status (max 90s) ==="
          for i in $(seq 1 18); do
            RENDER=$(curl -sf "http://localhost:8000/api/projects/${PROJECT_ID}/render/status")
            STATUS=$(echo "$RENDER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'] if d else 'none')")
            DONE=$(echo "$RENDER"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('done_segments',0) if d else 0)")
            TOTAL=$(echo "$RENDER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_segments',0) if d else 0)")
            echo "  [$i/18] status=$STATUS  done=$DONE/$TOTAL"
            if [[ "$STATUS" == "done" || "$STATUS" == "error" ]]; then break; fi
            sleep 5
          done
          echo "Final render status:"
          curl -sf "http://localhost:8000/api/projects/${PROJECT_ID}/render/status" | python3 -m json.tool

          echo ""
          echo "=== 7. Merge audio ==="
          curl -sf -X POST "http://localhost:8000/api/projects/${PROJECT_ID}/merge" | python3 -m json.tool

          echo ""
          echo "=== 8. List artifacts ==="
          ARTS=$(curl -sf "http://localhost:8000/api/projects/${PROJECT_ID}/artifacts")
          echo "$ARTS" | python3 -m json.tool
          ART_COUNT=$(echo "$ARTS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Artifacts created: $ART_COUNT"
          [ "$ART_COUNT" -gt 0 ] || (echo "ERROR: no artifacts" && exit 1)

          echo ""
          echo "✅ E2E smoke test PASSED"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== supervisord ==="
          docker exec nc_smoke cat /var/log/novelconverter/supervisord.log 2>/dev/null | tail -50 || true
          echo "=== orchestrator ==="
          docker exec nc_smoke cat /var/log/novelconverter/orchestrator.log 2>/dev/null | tail -80 || true
          echo "=== tts_custom ==="
          docker exec nc_smoke cat /var/log/novelconverter/tts_custom.log 2>/dev/null | tail -30 || true
          echo "=== docker logs ==="
          docker logs nc_smoke 2>&1 | tail -100

      - name: Cleanup
        if: always()
        run: docker rm -f nc_smoke 2>/dev/null || true
